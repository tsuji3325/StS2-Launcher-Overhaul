name: Compile JP Workshop fix

on:
  push:
    branches:
      - workshop-link-fallback
    paths:
      - "src/STS2Mobile/**"
      - ".github/workflows/compile-jp-workshop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Stage reference assemblies from upstream release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o upstream.apk \
            https://github.com/SocialHummingbird/StS2-Launcher-Overhaul/releases/download/v0.2.432/StS2Launcher-v0.2.432-arm64-v8a.apk
          dest=upstream/godot-export/.godot/mono/publish/arm64
          mkdir -p "$dest"
          for name in sts2 GodotSharp 0Harmony; do
            unzip -p upstream.apk "assets/dotnet_bcl/$name.dll" > "$dest/$name.dll"
            test -s "$dest/$name.dll"
          done
      - name: Build managed assembly
        run: dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release --no-self-contained -o artifacts/managed
      - name: Verify assembly
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/managed/STS2Mobile.dll
          sha256sum artifacts/managed/STS2Mobile.dll | tee artifacts/managed/sha256.txt
      - name: Upload managed assembly only
        uses: actions/upload-artifact@v4
        with:
          name: sts2-jp-workshop-managed
          path: |
            artifacts/managed/STS2Mobile.dll
            artifacts/managed/sha256.txt
          if-no-files-found: error
          retention-days: 7
